<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PNG alongside the SVG, for the window icon rather than the tab. A
         Chromium --app= window takes its icon from the page, and on Linux it
         will not rasterise an SVG favicon to get one — with only the SVG here
         it falls back to the browser's own icon, so Allegory in the panel
         wore Brave's face. Firefox has the same gap. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Allegory" />
    <meta name="theme-color" content="#09090b" />
    <!-- Wordmark font (Outfit 900) is self-hosted via @font-face in src/index.css -->
    <title>Allegory</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
